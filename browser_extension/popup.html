<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }
    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .shield { font-size: 1.8rem; }
    .header-text h2 { font-size: 0.95rem; color: #58a6ff; }
    .header-text p  { font-size: 0.72rem; color: #8b949e; margin-top: 2px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #21262d;
      font-size: 0.82rem;
    }
    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #3fb950;
      animation: pulse 1.5s infinite;
    }
    .dot.offline { background: #f85149; animation: none; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: #21262d;
      border-bottom: 1px solid #21262d;
    }
    .stat-cell {
      background: #0d1117;
      padding: 12px 8px;
      text-align: center;
    }
    .stat-cell .num {
      font-size: 1.5rem;
      font-weight: bold;
      display: block;
    }
    .stat-cell .lbl { font-size: 0.68rem; color: #8b949e; text-transform: uppercase; }
    .num-total  { color: #58a6ff; }
    .num-safe   { color: #3fb950; }
    .num-threat { color: #f85149; }

    .last-event {
      padding: 10px 16px;
      font-size: 0.75rem;
      color: #8b949e;
      border-bottom: 1px solid #21262d;
      min-height: 44px;
    }
    .last-event span { color: #c9d1d9; }

    .actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-blue { background: #1f6feb; color: #fff; }
    .btn-blue:hover { background: #388bfd; }
    .btn-muted { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
    .btn-muted:hover { color: #c9d1d9; }

    .footer {
      padding: 8px 16px;
      text-align: center;
      font-size: 0.68rem;
      color: #484f58;
      border-top: 1px solid #21262d;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="shield">🛡️</div>
    <div class="header-text">
      <h2>SentinelLearn Monitor</h2>
      <p>Real-time browser threat detection</p>
    </div>
  </div>

  <div class="status-row">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Checking backend…</span>
  </div>

  <div class="stats-grid">
    <div class="stat-cell">
      <span class="num num-total" id="numTotal">0</span>
      <span class="lbl">Checked</span>
    </div>
    <div class="stat-cell">
      <span class="num num-safe" id="numSafe">0</span>
      <span class="lbl">Safe</span>
    </div>
    <div class="stat-cell">
      <span class="num num-threat" id="numThreat">0</span>
      <span class="lbl">Threats</span>
    </div>
  </div>

  <div class="last-event" id="lastEvent">
    Last event: <span>None yet</span>
  </div>

  <div class="actions">
    <a href="http://localhost:5000/dashboard" target="_blank" class="btn btn-blue">
      Open Dashboard &amp; Live Logs →
    </a>
    <button class="btn btn-muted" id="clearBtn">Reset Session Stats</button>
  </div>

  <div class="footer">Sentinel AI &bull; SentinelLearn Platform</div>

  <script src="popup.js"></script>
</body>
</html>
