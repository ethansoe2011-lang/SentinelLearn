<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Hub | SentinelLearn</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(to right, #000000, #2b2b2b);
            --neon-primary: #00f3ff;
            --panel-bg: rgba(15, 15, 15, 0.75);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0;
            padding: 0;
            background: var(--bg-gradient); 
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }
        header h1 { margin: 0; font-size: 1.4rem; color: #fff; font-weight: 600; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px;}
        header h1::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--neon-primary); box-shadow: 0 0 10px var(--neon-primary); }
        .nav-links a { color: var(--text-muted); text-decoration: none; margin-left: 25px; font-weight: 500; font-size: 0.95rem; transition: all 0.3s; }
        .nav-links a:hover { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.6); }

        .content-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .card { 
            background: var(--panel-bg); 
            padding: 50px; 
            border-radius: 20px; 
            border: 1px solid var(--border-light);
            max-width: 800px; 
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        
        .card h1 { color: #fff; margin-top: 0; font-weight: 600; font-size: 2rem; text-align: center;}
        p.subtitle { text-align: center; font-size: 1.05rem; color: var(--text-muted); margin-bottom: 40px; }
        
        .chat-container { display: flex; flex-direction: column; gap: 20px; }
        
        textarea {
            width: 100%;
            padding: 20px;
            background-color: rgba(0,0,0,0.5);
            color: #fff;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            font-size: 1.05rem;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            box-sizing: border-box;
            transition: all 0.3s;
            outline: none;
        }
        textarea:focus { border-color: var(--neon-primary); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        
        .btn {
            padding: 14px 30px;
            background-color: transparent;
            color: var(--neon-primary);
            border: 1px solid var(--neon-primary);
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            transition: all 0.3s;
            align-self: flex-end;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
        }
        .btn:hover:not(:disabled) { 
            background-color: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            text-shadow: 0 0 8px var(--neon-primary);
        }
        .btn:disabled { border-color: #444; color: #444; cursor: not-allowed; box-shadow: none; }

        .response-area {
            margin-top: 30px;
            padding: 25px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            display: none;
            line-height: 1.7;
            font-size: 1.05rem;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .response-area h3 { margin-top: 0; color: var(--neon-primary); font-size: 1.1rem; margin-bottom: 15px; letter-spacing: 1px; text-transform: uppercase;}
    </style>
</head>
<body>
    <header>
        <h1>Sentinel EduBot</h1>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/password-manager">Password Vault</a>
            <a href="/quiz">Quizzes</a>
        </div>
    </header>

    <div class="content-wrapper">
        <div class="card">
            <h1>Ask Sentinel AI</h1>
            <p class="subtitle">Ask any question about cybersecurity, malware, or safe browsing habits.</p>
            
            <div class="chat-container">
                <textarea id="questionInput" placeholder="E.g., What is ransomware and how do I prevent it?"></textarea>
                <button id="askBtn" class="btn">Ask Sentinel</button>
            </div>

            <div id="responseArea" class="response-area">
                <h3>AI Response</h3>
                <div id="responseContent" style="color: #ddd;"></div>
            </div>
        </div>
    </div>

    <script>
        const askBtn = document.getElementById('askBtn');
        const questionInput = document.getElementById('questionInput');
        const responseArea = document.getElementById('responseArea');
        const responseContent = document.getElementById('responseContent');

        askBtn.addEventListener('click', async () => {
            const question = questionInput.value.trim();
            if (!question) return;
            
            askBtn.disabled = true;
            askBtn.innerText = 'Thinking...';
            responseArea.style.display = 'block';
            responseContent.innerHTML = '<span style="color: #888; font-style: italic;">Synthesizing answer...</span>';

            try {
                const res = await fetch('/api/ask-education', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                
                const json = await res.json();
                
                if (json.status === 'success') {
                    responseContent.innerHTML = json.answer.replace(/\n/g, '<br>');
                } else {
                    responseContent.innerHTML = `<span style="color: #ff073a;">Error: ${json.message}</span>`;
                }
            } catch (e) {
                responseContent.innerHTML = '<span style="color: #ff073a;">Connection error communicating with Sentinel AI.</span>';
            } finally {
                askBtn.disabled = false;
                askBtn.innerText = 'Ask Sentinel';
            }
        });
    </script>
</body>
</html>
