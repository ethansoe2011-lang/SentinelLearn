<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Dashboard</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(to right, #000000, #2b2b2b);
            --neon-primary: #00f3ff;
            --neon-danger: #ff073a;
            --neon-safe: #39ff14;
            --panel-bg: rgba(15, 15, 15, 0.75);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: var(--text-main);
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Sleek Top Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }
        header h1 { margin: 0; font-size: 1.4rem; color: #fff; font-weight: 600; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px;}
        header h1::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--neon-primary); box-shadow: 0 0 10px var(--neon-primary); }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 25px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .nav-links a:hover { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.6); }

        .dashboard-content { padding: 30px 40px; flex: 1; display: flex; flex-direction: column; min-height: 0; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            flex: 1;
            min-height: 0; 
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }
        
        .panel h2 {
            margin-top: 0;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 500;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;}
        
        input, select {
            width: 100%;
            padding: 14px 16px;
            background-color: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--neon-primary); box-shadow: 0 0 12px rgba(0, 243, 255, 0.2); }
        
        .btn {
            padding: 14px 24px;
            background-color: transparent;
            color: var(--neon-primary);
            border: 1px solid var(--neon-primary);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0,243,255,0.1);
        }
        .btn:hover:not(:disabled) { 
            background-color: rgba(0, 243, 255, 0.1); 
            box-shadow: 0 0 20px rgba(0,243,255,0.4); 
            text-shadow: 0 0 8px var(--neon-primary);
        }
        .btn:disabled { border-color: #444; color: #444; cursor: not-allowed; box-shadow: none; }
        
        .log-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 15px;
        }
        .log-entry {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-light);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .log-entry:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.6); }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .log-analysis { line-height: 1.6; color: #ccc; font-size: 0.95rem; }

        .badge {
            padding: 6px 12px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 10px currentColor;
        }
        .badge.safe { background: rgba(57, 255, 20, 0.1); color: var(--neon-safe); border: 1px solid var(--neon-safe); }
        .badge.threat { background: rgba(255, 7, 58, 0.1); color: var(--neon-danger); border: 1px solid var(--neon-danger); }

        #refreshLogs {
            background: transparent; border: 1px solid var(--border-light); color: var(--text-muted); 
            padding: 8px 16px; border-radius: 50px; cursor: pointer; font-size: 0.85rem; transition: all 0.3s;
        }
        #refreshLogs:hover { border-color: #fff; color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.2); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-primary); box-shadow: 0 0 10px var(--neon-primary); }
    </style>
</head>
<body>

    <header>
        <h1>Sentinel Security Dashboard</h1>
        <div class="nav-links">
            <a href="/password-manager">Password Vault</a>
            <a href="/education">Education Hub</a>
            <a href="/quiz">Quizzes</a>
            <a href="/logs">Full Logs</a>
        </div>
    </header>

    <div class="dashboard-content">
        <div class="dashboard-grid">
            <div class="panel">
                <h2>Manual Activity & URL Scanner</h2>
                <div class="form-group">
                    <label>Activity Type</label>
                    <select id="activityType">
                        <option value="url">URL Check</option>
                        <option value="file">File Download</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Target Value</label>
                    <input type="text" id="activityValue" placeholder="e.g., http://suspicious-link.com">
                </div>
                <button class="btn" id="scanBtn">Scan Activity</button>

                <div id="scanResult" style="margin-top: 25px; padding: 18px; border-radius: 12px; display: none; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); font-size: 0.95rem; line-height: 1.5;"></div>
            </div>

            <div class="panel">
                <h2>Live System Logs <button id="refreshLogs">Refresh</button></h2>
                <div class="log-container" id="logContainer">
                    <div style="color: #666; text-align: center; margin-top: 40px; font-style: italic;">Fetching logs...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('scanBtn').addEventListener('click', async () => {
            const type = document.getElementById('activityType').value;
            const value = document.getElementById('activityValue').value;
            const resDiv = document.getElementById('scanResult');
            const btn = document.getElementById('scanBtn');

            if (!value) return;

            btn.innerText = "Scanning...";
            btn.disabled = true;

            try {
                const req = await fetch('/api/activity-check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, value, source: "manual_scanner" })
                });
                const res = await req.json();
                
                resDiv.style.display = 'block';
                if (res.status === 'success') {
                    const color = res.verdict === 'SAFE' ? '#39ff14' : '#ff073a';
                    const glow = res.verdict === 'SAFE' ? 'rgba(57,255,20,0.2)' : 'rgba(255,7,58,0.2)';
                    resDiv.style.borderColor = color;
                    resDiv.style.boxShadow = `0 0 15px ${glow}`;
                    resDiv.innerHTML = `<strong style="color: ${color}; text-shadow: 0 0 8px ${color}">${res.verdict}</strong><br><br>${res.analysis}`;
                    fetchLogs(); 
                } else {
                    resDiv.innerHTML = `Error: ${res.message}`;
                }
            } catch (e) {
                resDiv.style.display = 'block';
                resDiv.innerHTML = `Connection Error.`;
            } finally {
                btn.innerText = "Scan Activity";
                btn.disabled = false;
            }
        });

        async function fetchLogs() {
            const container = document.getElementById('logContainer');
            try {
                const req = await fetch('/api/logs?limit=20');
                const res = await req.json();
                
                if (res.status === 'success') {
                    container.innerHTML = '';
                    if (res.logs.length === 0) {
                        container.innerHTML = '<div style="color: #666; text-align: center; margin-top: 40px; font-style: italic;">No logs recorded yet.</div>';
                        return;
                    }
                    
                    res.logs.forEach(log => {
                        const date = new Date(log.timestamp).toLocaleTimeString();
                        const badgeClass = log.verdict === 'SAFE' ? 'safe' : 'threat';
                        
                        container.innerHTML += `
                            <div class="log-entry">
                                <div class="log-header">
                                    <span>[${date}] ${log.source}</span>
                                    <span class="badge ${badgeClass}">${log.verdict}</span>
                                </div>
                                <div class="log-analysis">${log.analysis || log.input}</div>
                            </div>
                        `;
                    });
                }
            } catch (e) {
                container.innerHTML = '<div style="color: #ff073a; text-align: center; margin-top: 40px;">Error fetching logs.</div>';
            }
        }

        document.getElementById('refreshLogs').addEventListener('click', fetchLogs);
        fetchLogs();
        setInterval(fetchLogs, 15000); 
    </script>
</body>
</html>
