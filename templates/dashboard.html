<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Dashboard</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(to right, #000000, #2b2b2b);
            --glow-primary: #4facfe;
            --glow-danger: #e74c3c;
            --glow-safe: #2ecc71;
            --panel-bg: rgba(15, 15, 15, 0.75);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: var(--text-main);
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }
        header h1 { margin: 0; font-size: 1.4rem; color: #fff; font-weight: 600; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px;}
        header h1::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--glow-primary); box-shadow: 0 0 10px var(--glow-primary); }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 25px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .nav-links a:hover { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.6); }

        .dashboard-content { padding: 30px 40px; flex: 1; display: flex; flex-direction: column; min-height: 0; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            flex: 1;
            min-height: 0; 
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }
        
        .panel h2 {
            margin-top: 0;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 500;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;}
        
        input, select {
            width: 100%;
            padding: 14px 16px;
            background-color: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--glow-primary); box-shadow: 0 0 12px rgba(79, 172, 254, 0.2); }
        
        .btn {
            padding: 14px 24px;
            background-color: transparent;
            color: var(--glow-primary);
            border: 1px solid var(--glow-primary);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.1);
        }
        .btn:hover:not(:disabled) { 
            background-color: rgba(79, 172, 254, 0.1); 
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4); 
            text-shadow: 0 0 8px var(--glow-primary);
        }
        .btn:disabled { border-color: #444; color: #444; cursor: not-allowed; box-shadow: none; }
        
        .log-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 15px;
        }
        .log-entry {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-light);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .log-entry:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.6); }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .log-analysis { line-height: 1.6; color: #ccc; font-size: 0.95rem; }

        .badge {
            padding: 6px 12px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 10px currentColor;
        }
        .badge.safe { background: rgba(46, 204, 113, 0.1); color: var(--glow-safe); border: 1px solid var(--glow-safe); }
        .badge.threat { background: rgba(231, 76, 60, 0.1); color: var(--glow-danger); border: 1px solid var(--glow-danger); }

        #refreshLogs {
