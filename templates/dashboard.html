<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --neon-primary: #00f3ff;
            --neon-danger: #ff073a;
            --neon-safe: #39ff14;
            --neon-warning: #ffaa00;
            --panel-bg: rgba(18, 18, 18, 0.75);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #888888;
            --glass-blur: blur(20px);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #151515 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(5, 5, 5, 0.65);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-light);
            z-index: 10;
        }
        
        header h1 { 
            margin: 0; font-size: 1.3rem; color: #fff; font-weight: 600; 
            letter-spacing: 0.5px; display: flex; align-items: center; gap: 12px;
        }
        
        header h1::before { 
            content: ''; display: inline-block; width: 10px; height: 10px; 
            border-radius: 50%; background: var(--neon-primary); 
            box-shadow: 0 0 12px var(--neon-primary), 0 0 20px var(--neon-primary); 
        }

        .header-right { display: flex; align-items: center; gap: 30px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a {
            color: var(--text-muted); text-decoration: none; font-weight: 500; 
            font-size: 0.95rem; transition: all 0.3s; position: relative;
        }
        .nav-links a:hover { color: #fff; }
        .nav-links a::after {
            content: ''; position: absolute; left: 0; bottom: -5px; width: 0%; 
            height: 2px; background: var(--neon-primary); transition: width 0.3s ease;
        }
        .nav-links a:hover::after { width: 100%; box-shadow: 0 0 8px var(--neon-primary); }

        /* Auth Widget */
        #auth-widget { display: flex; align-items: center; gap: 14px; }
        .auth-sign-in-btn { padding: 7px 18px; background: transparent; color: var(--neon-primary); border: 1px solid var(--neon-primary); border-radius: 50px; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .auth-sign-in-btn:hover { background: rgba(0,243,255,0.1); box-shadow: 0 0 15px rgba(0,243,255,0.3); }
        .auth-dropdown { position: absolute; top: calc(100% + 10px); right: 0; background: rgba(12,12,12,0.97); border: 1px solid var(--border-light); border-radius: 14px; padding: 10px; min-width: 220px; display: none; flex-direction: column; gap: 6px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 200; }
        .auth-dropdown.open { display: flex; }
        .auth-provider-btn { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-light); background: rgba(255,255,255,0.03); color: #eee; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.25s; }
        .auth-provider-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); color: #fff; }
        .auth-dropdown-label { padding: 6px 16px 4px; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .auth-user-info { display: flex; align-items: center; gap: 10px; }
        .auth-avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--neon-primary); object-fit: cover; }
        .auth-avatar-placeholder { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--neon-primary); background: rgba(0,243,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .auth-name { font-size: 0.85rem; font-weight: 600; color: #fff; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .auth-sign-out-btn { padding: 6px 14px; background: transparent; color: var(--text-muted); border: 1px solid var(--border-light); border-radius: 50px; font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.3s; text-decoration: none; }
        .auth-sign-out-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); }
        .auth-sign-in-wrapper { position: relative; }

        .dashboard-content { 
            padding: 40px 50px; flex: 1; display: flex; flex-direction: column; min-height: 0; 
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            flex: 1;
            min-height: 0; 
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
            backdrop-filter: var(--glass-blur);
            overflow: hidden;
            position: relative;
        }
        
        .panel h2 {
            margin-top: 0; color: #fff; font-size: 1.4rem; font-weight: 500;
            border-bottom: 1px solid var(--border-light); padding-bottom: 20px;
            margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;
        }

        .form-group { margin-bottom: 25px; }
        label { 
            display: block; margin-bottom: 10px; color: var(--text-muted); 
            font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
        }
        
        input, select {
            width: 100%; padding: 16px 20px; background-color: rgba(0, 0, 0, 0.4);
            color: #fff; border: 1px solid var(--border-light); border-radius: 12px;
            box-sizing: border-box; font-size: 1rem; font-family: 'Inter', sans-serif;
            transition: all 0.3s ease; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        input:focus, select:focus { 
            border-color: var(--neon-primary); 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 12px rgba(0, 243, 255, 0.2); 
            background-color: rgba(0,0,0,0.6);
        }
        
        .btn {
            padding: 16px 24px; background-color: transparent; color: var(--text-main);
            border: 1px solid var(--border-light); border-radius: 12px;
            cursor: pointer; font-weight: 600; width: 100%; font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden; font-family: 'Inter', sans-serif;
        }
        
        .btn-primary { border-color: var(--neon-primary); color: var(--neon-primary); }
        .btn-primary:hover:not(:disabled) { 
            background-color: rgba(0, 243, 255, 0.1); 
            box-shadow: 0 0 25px rgba(0,243,255,0.4), inset 0 0 10px rgba(0,243,255,0.2); 
            text-shadow: 0 0 8px var(--neon-primary);
            transform: translateY(-2px);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .log-container { flex: 1; overflow-y: auto; padding-right: 15px; }
        
        .log-entry {
            background: rgba(5, 5, 5, 0.6);
            border: 1px solid var(--border-light);
            padding: 20px; border-radius: 16px; margin-bottom: 20px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .log-entry:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
        
        .log-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; font-size: 0.85rem; color: var(--text-muted);
            font-family: monospace;
        }
        .log-analysis { line-height: 1.6; color: #d0d0d0; font-size: 0.95rem; }

        .badge {
            padding: 6px 14px; border-radius: 50px; font-weight: 700; font-size: 0.75rem;
            letter-spacing: 1px; text-transform: uppercase;
        }
        .badge.safe { background: rgba(57, 255, 20, 0.1); color: var(--neon-safe); border: 1px solid var(--neon-safe); box-shadow: 0 0 10px rgba(57, 255, 20, 0.3); }
        .badge.threat { background: rgba(255, 7, 58, 0.1); color: var(--neon-danger); border: 1px solid var(--neon-danger); box-shadow: 0 0 10px rgba(255, 7, 58, 0.3); }
        .badge.suspicious { background: rgba(255, 170, 0, 0.1); color: var(--neon-warning); border: 1px solid var(--neon-warning); box-shadow: 0 0 10px rgba(255, 170, 0, 0.3); }

        #refreshLogs {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); 
            color: var(--text-muted); padding: 8px 18px; border-radius: 50px; 
            cursor: pointer; font-size: 0.85rem; transition: all 0.3s; font-weight: 500;
        }
        #refreshLogs:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: #fff; }

        #scanResult {
            margin-top: 30px; padding: 25px; border-radius: 16px; display: none;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            font-size: 1rem; line-height: 1.6; backdrop-filter: blur(10px);
            animation: slideDown 0.4s ease forwards;
        }

        .risk-list {
            margin-top: 15px;
            padding-left: 20px;
            color: var(--neon-warning);
            font-size: 0.9rem;
        }
        .risk-list li { margin-bottom: 5px; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-primary); }
    </style>
</head>
<body>

    <header>
        <h1>Sentinel Security Dashboard</h1>
        <div class="header-right">
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/password-manager">Password Vault</a>
                <a href="/education">Education Hub</a>
                <a href="/quiz">Quizzes</a>
                <a href="/logs">Full Logs</a>
            </div>
            <div id="auth-widget"><span style="color:#444;font-size:0.8rem;">...</span></div>
        </div>
    </header>

    <div class="dashboard-content">
        <div class="dashboard-grid">
            <div class="panel">
                <h2>Manual Activity &amp; URL Scanner</h2>
                <div class="form-group">
                    <label>Activity Type</label>
                    <select id="activityType">
                        <option value="url">URL Check</option>
                        <option value="file">File Download</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Target Value</label>
                    <input type="text" id="activityValue" placeholder="e.g., http://suspicious-link.com" autocomplete="off">
                </div>
                <button class="btn btn-primary" id="scanBtn">Scan Activity</button>

                <div id="scanResult"></div>
            </div>

            <div class="panel">
                <h2>Live System Logs <button id="refreshLogs">Refresh Logs</button></h2>
                <div class="log-container" id="logContainer">
                    <div style="color: #666; text-align: center; margin-top: 40px; font-style: italic;">Fetching logs...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        document.getElementById('scanBtn').addEventListener('click', async () => {
            const type = document.getElementById('activityType').value;
            const value = document.getElementById('activityValue').value;
            const resDiv = document.getElementById('scanResult');
            const btn = document.getElementById('scanBtn');

            if (!value) return;

            btn.innerText = "Scanning...";
            btn.disabled = true;

            try {
                const req = await fetch('/api/activity-check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, value, source: "manual_scanner" })
                });
                const res = await req.json();
                
                resDiv.style.display = 'block';
                if (res.status === 'success') {
                    let color = 'var(--text-main)';
                    let glow = 'transparent';
                    
                    if (res.verdict === 'SAFE') {
                        color = 'var(--neon-safe)'; glow = 'rgba(57,255,20,0.15)';
                    } else if (res.verdict === 'THREAT') {
                        color = 'var(--neon-danger)'; glow = 'rgba(255,7,58,0.15)';
                    } else {
                        color = 'var(--neon-warning)'; glow = 'rgba(255,170,0,0.15)';
                    }
                    
                    resDiv.style.borderColor = color;
                    resDiv.style.backgroundColor = glow;
                    resDiv.style.boxShadow = `0 0 20px ${glow}`;
                    
                    let htmlContent = `<strong style="color: ${color}; font-size: 1.1rem; letter-spacing: 1px; text-shadow: 0 0 8px ${color}">${res.verdict}</strong>`;
                    if (res.confidence_score !== undefined) {
                        htmlContent += `<span style="font-size:0.85rem; color:#aaa; margin-left: 10px;">Confidence: ${(res.confidence_score * 100).toFixed(0)}%</span>`;
                    }
                    htmlContent += `<br><br><span style="color: #eee;">${res.summary}</span>`;
                    
                    if (res.risk_factors && res.risk_factors.length > 0) {
                        htmlContent += `<ul class="risk-list">`;
                        res.risk_factors.forEach(rf => htmlContent += `<li>${rf}</li>`);
                        htmlContent += `</ul>`;
                    }
                    
                    resDiv.innerHTML = htmlContent;
                    fetchLogs(); 
                } else {
                    resDiv.innerHTML = `Error: ${res.message}`;
                }
            } catch (e) {
                resDiv.style.display = 'block';
                resDiv.innerHTML = `Connection Error.`;
            } finally {
                btn.innerText = "Scan Activity";
                btn.disabled = false;
            }
        });

        async function fetchLogs() {
            const container = document.getElementById('logContainer');
            try {
                const req = await fetch('/api/logs?limit=20');
                const res = await req.json();
                
                if (res.status === 'success') {
                    container.innerHTML = '';
                    if (res.logs.length === 0) {
                        container.innerHTML = '<div style="color: #666; text-align: center; margin-top: 40px; font-style: italic;">No logs recorded yet.</div>';
                        return;
                    }
                    
                    res.logs.forEach(log => {
                        const date = new Date(log.timestamp).toLocaleTimeString();
                        let badgeClass = 'suspicious';
                        if (log.verdict === 'SAFE') badgeClass = 'safe';
                        if (log.verdict === 'THREAT') badgeClass = 'threat';
                        
                        const summaryText = log.summary || log.analysis || log.input || "No summary provided.";
                        
                        container.innerHTML += `
                            <div class="log-entry">
                                <div class="log-header">
                                    <span>[${date}] ${log.source}</span>
                                    <span class="badge ${badgeClass}">${log.verdict}</span>
                                </div>
                                <div class="log-analysis">${summaryText}</div>
                            </div>
                        `;
                    });
                }
            } catch (e) {
                container.innerHTML = '<div style="color: #ff073a; text-align: center; margin-top: 40px;">Error fetching logs.</div>';
            }
        }

        document.getElementById('refreshLogs').addEventListener('click', fetchLogs);
        fetchLogs();
        setInterval(fetchLogs, 15000);

        // ── Auth Widget ──
        async function initAuthWidget() {
            const widget = document.getElementById('auth-widget');
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (data.logged_in && data.user) {
                    const user = data.user;
                    const avatarHtml = user.picture
                        ? `<img class="auth-avatar" src="${escapeHtml(user.picture)}" alt="avatar">`
                        : `<div class="auth-avatar-placeholder">👤</div>`;
                    widget.innerHTML = `<div class="auth-user-info">${avatarHtml}<span class="auth-name">${escapeHtml(user.name)}</span><a href="/auth/logout" class="auth-sign-out-btn">Sign Out</a></div>`;
                } else {
                    widget.innerHTML = `
                        <div class="auth-sign-in-wrapper">
                            <button class="auth-sign-in-btn" id="signInBtn">Sign In ▾</button>
                            <div class="auth-dropdown" id="authDropdown">
                                <div class="auth-dropdown-label">Continue with</div>
                                <a href="/auth/google" class="auth-provider-btn">🔵 Google</a>
                                <a href="/auth/github" class="auth-provider-btn">⚫ GitHub</a>
                            </div>
                        </div>
                    `;
                    const btn = document.getElementById('signInBtn');
                    const dd = document.getElementById('authDropdown');
                    btn.addEventListener('click', (e) => { e.stopPropagation(); dd.classList.toggle('open'); });
                    document.addEventListener('click', () => dd.classList.remove('open'));
                }
            } catch(e) { widget.innerHTML = ''; }
        }
        initAuthWidget();
    </script>
</body>
</html>
