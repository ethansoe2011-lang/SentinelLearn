<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelLearn | AI Cybersecurity Platform</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(to right, #000000, #2b2b2b);
            --glow-primary: #4facfe;
            --glow-secondary: #9b59b6;
            --glow-green: #2ecc71;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --panel-bg: rgba(20, 20, 20, 0.7);
            --border-light: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 0;
            background: var(--bg-gradient); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 60px 40px;
            background: var(--panel-bg);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { 
            font-size: 1.25rem; 
            color: var(--text-muted); 
            line-height: 1.6; 
            margin-bottom: 40px; 
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .button-group { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            flex-wrap: wrap; 
        }

        .btn { 
            display: inline-block; 
            padding: 14px 28px; 
            background-color: transparent; 
            color: var(--text-main); 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: 600; 
            font-size: 1rem;
            border: 1px solid var(--border-light);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.05);
            z-index: -1;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .btn:hover::before { opacity: 1; }

        .btn-primary { 
            border-color: var(--glow-primary); 
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.2);
            color: var(--glow-primary);
        }
        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.6), inset 0 0 10px rgba(79, 172, 254, 0.2);
            text-shadow: 0 0 8px var(--glow-primary);
        }

        .btn-success { 
            border-color: var(--glow-green); 
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
            color: var(--glow-green);
        }
        .btn-success:hover {
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.6), inset 0 0 10px rgba(46, 204, 113, 0.2);
            text-shadow: 0 0 8px var(--glow-green);
        }

            color: var
