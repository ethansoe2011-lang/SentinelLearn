<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelLearn | AI Cybersecurity Platform</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        p { font-size: 1.2rem; color: #555; line-height: 1.6; margin-bottom: 30px; }
        .button-group { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #0070f3; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background-color: #005bb5; }
        .btn-outline { background-color: transparent; color: #0070f3; border: 2px solid #0070f3; }
        .btn-outline:hover { background-color: #0070f3; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to SentinelLearn</h1>
        <p>An AI-Driven Cybersecurity & Threat Simulation Platform designed to bridge the gap between theoretical cybersecurity education and practical threat recognition.</p>
        <div class="button-group">
            <a href="/dashboard" class="btn">Launch Dashboard</a>
            <a href="/password-manager" class="btn btn-outline" style="border-color: #3fb950; color: #3fb950;">Password Manager</a>
            <a href="/education" class="btn btn-outline">Threat Education Hub</a>
            <a href="/quiz" class="btn btn-outline" style="border-color: #8e44ad; color: #8e44ad;">Flashcards & Quizzes</a>
        </div>
    </div>
</body>
</html>
